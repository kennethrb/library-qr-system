<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Library QR Scanner</title>

https://unpkg.com/html5-qrcodescript>

<style>
body{
    font-family:Arial,sans-serif;
    text-align:center;
    padding:20px;
}

#reader{
    width:350px;
    max-width:100%;
    margin:auto;
}

#result{
    margin-top:20px;
    font-size:24px;
}
</style>
</head>

<body>

<h2>Library QR Scanner</h2>

<div id="reader"></div>

<div id="result"></div>

<script>

const WEBAPP_URL = "https://script.google.com/macros/s/AKfycbwZt98HfRSdzgFoWVrGG3hjFuG8W7OqdVQw1R8laWfMoA29ArTQv7H88rNl6gtIbR4mmg/exec";

let lastScan = "";

function onScanSuccess(decodedText){

 if(decodedText === lastScan){
    return;
 }

 lastScan = decodedText;

 fetch(WEBAPP_URL,{
    method:'POST',
    body:JSON.stringify({
      studentId:decodedText
    })
 })
 .then(response => response.json())
 .then(data => {

    if(data.success){
      document.getElementById('result').innerHTML =
      "✅ Welcome " + data.name;
    } else {
      document.getElementById('result').innerHTML =
      "❌ Student Not Found";
    }

    setTimeout(()=>{
      lastScan = "";
    },3000);
 });

}

new Html5QrcodeScanner(
"reader",
{
  fps:10,
  qrbox:250
}).render(onScanSuccess);

</script>

</body>
</html>
