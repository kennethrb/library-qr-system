<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
    
<meta charset="utf-8">
<title>Library QR Scanner</title>
<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{
    margin:0;
    padding:20px;
    font-family:'Segoe UI',sans-serif;
    background:#f5f7fb;
}

.container{
    max-width:500px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:15px;
    box-shadow:0 3px 10px rgba(0,0,0,.1);
}

.logo{
    width:100px;
    display:block;
    margin:auto;
    margin-bottom:15px;
}

h1{
    text-align:center;
    color:#003366;
    margin:10px 0 5px;
}

h3{
    text-align:center;
    margin:0 0 20px;
    font-weight:600;
} 

#datetime{
    text-align:center;
    margin-bottom:20px;
    color:#666;
}

#reader{
    width:100% !important;
    border-radius:12px;
    overflow:hidden;
}

.stats{
    display:flex;
    justify-content:center;
    margin-bottom:20px;
}

.stat-card{
    background:#f8f9fa;
    border-radius:12px;
    padding:12px;
    width:150px;
    text-align:center;
}

.stat-card span{
    display:block;
    font-size:30px;
    font-weight:bold;
    text-align: center;
}

.success{
    background:#d4edda;
    color:#155724;
    padding:15px;
    border-radius:10px;
    text-align:center;
}

.error{
    background:#f8d7da;
    color:#721c24;
    padding:15px;
    border-radius:10px;
}

.last-student{
    margin-top:15px;
    text-align:center;
    font-weight:bold;
    font-size:18px;
}

.footer{
    margin-top:20px;
    text-align:center;
    color:#888;
    font-size:12px;
}    

@media(max-width:480px){
    h1{
        font-size:22px;
    }
}
</style>
</head>

<body>

    <div class="container">

    <!-- Replace logo.png with your school logo -->
    <img id="schoolLogo" src="logo.png" class="logo" alt="School Logo">

    <h1>ABC National High School</h1>
    <h3>Library Attendance Monitoring System</h3>

    <div id="datetime"></div>

    <div class="stats">
        <div class="stat-card">
            <span id="scanCount">0</span>
            <small>Today's Scans</small>
        </div>
    </div>

    <div id="reader"></div>

    <div id="result"></div>

    <div class="last-student">
        Last Scan:
        <span id="lastStudent">None</span>
    </div>

</div>
    
<div class="footer">
Version 1.0 | Powered by QR Technology
</div>

<script>
let WEBAPP_URL = "";

const schoolCode = new URLSearchParams(window.location.search).get("school");

async function loadSchoolConfig() {
    try {
        const response = await fetch("schools.json");
        const schools = await response.json();
        const school = schools[schoolCode];

        if (!school) {
            document.body.innerHTML = "<h1 style='text-align:center;margin-top:50px;'>Invalid or Missing School Code</h1>";
            return false;
        }

        WEBAPP_URL = school.webapp;
        document.querySelector("h1").innerText = school.name;
        document.getElementById("schoolLogo").src = school.logo;
        return true;
    } catch (err) {
        document.body.innerHTML = "<h1 style='text-align:center;margin-top:50px;'>Failed to load configuration</h1>";
        return false;
    }
}

function updateTime() {
    document.getElementById("datetime").innerHTML = new Date().toLocaleString();
}
setInterval(updateTime, 1000);
updateTime();

let lastScan = "";
let lastScanTime = 0;
let scanCount = 0;

async function onScanSuccess(decodedText) {
    const now = Date.now();

    // 10-second duplicate scan prevention
    if (decodedText === lastScan && now - lastScanTime < 10000) {
        return;
    }

    lastScan = decodedText;
    lastScanTime = now;

    try {
        const response = await fetch(WEBAPP_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ studentId: decodedText })
        });

        const data = await response.json();

        if (data.success) {
            scanCount++;
            document.getElementById("scanCount").innerText = scanCount;
            document.getElementById("lastStudent").innerText = data.name;
            document.getElementById("result").innerHTML = `
                <div class="success">
                    <div style="font-size:20px;">✅ Welcome</div>
                    <div style="font-size:28px;font-weight:bold;margin-top:5px;">${data.name}</div>
                </div>`;
        } else {
            document.getElementById("result").innerHTML = `
                <div class="error">❌ Student Not Found</div>`;
        }
    } catch (error) {
        document.getElementById("result").innerHTML = `
            <div class="error">⚠️ Network/Server Error</div>`;
    }
}

// Initialize scanner only after successful config load
loadSchoolConfig().then((isLoaded) => {
    if (!isLoaded) return;

    const scanner = new Html5QrcodeScanner("reader", {
        fps: 10,
        qrbox: 250
    });

    scanner.render(onScanSuccess);
});

</script>

</body>
</html>
