<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
    
<meta charset="utf-8">
<title>Library QR Scanner</title>
<script src="https://unpkg.com/html5-qrcode"></script>

<style>
:root {
    --primary: #1e293b;
    --accent: #2563eb;
    --bg: #f1f5f9;
    --card-bg: #ffffff;
    --text-main: #0f172a;
    --text-muted: #64748b;
    --success-bg: #dcfce7;
    --success-text: #15803d;
    --error-bg: #fee2e2;
    --error-text: #b91c1c;
}

body {
    margin: 0;
    padding: 30px 15px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background-color: var(--bg);
    color: var(--text-main);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    box-sizing: border-box;
}

.container {
    width: 100%;
    max-width: 440px;
    background: var(--card-bg);
    padding: 28px 24px;
    border-radius: 20px;
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
    border: 1px solid rgba(226, 232, 240, 0.8);
}

.logo {
    width: 80px;
    height: 80px;
    object-fit: contain;
    display: block;
    margin: 0 auto 16px;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.06));
}

h1 {
    text-align: center;
    color: var(--primary);
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin: 0 0 4px 0;
}

h3 {
    text-align: center;
    color: var(--text-muted);
    font-size: 13px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin: 0 0 16px 0;
} 

#datetime {
    text-align: center;
    font-size: 13px;
    font-weight: 500;
    margin-bottom: 20px;
    color: var(--text-muted);
    background: #f8fafc;
    padding: 6px 12px;
    border-radius: 20px;
    display: inline-block;
    width: fit-content;
    margin-left: auto;
    margin-right: auto;
}

.stats {
    display: flex;
    justify-content: center;
    margin-bottom: 20px;
}

.stat-card {
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 14px;
    padding: 10px 20px;
    min-width: 130px;
    text-align: center;
}

.stat-card span {
    display: block;
    font-size: 32px;
    font-weight: 800;
    color: var(--accent);
    line-height: 1.1;
}

.stat-card small {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    font-weight: 600;
    color: var(--text-muted);
}

#reader {
    width: 100% !important;
    border-radius: 14px;
    overflow: hidden;
    border: none !important;
    background: #000;
}

/* Custom Overrides for html5-qrcode UI elements */
#reader video {
    object-fit: cover;
    border-radius: 14px;
}

#reader__dashboard {
    padding: 10px 0 !important;
}

#result {
    margin-top: 16px;
}

.success {
    background: var(--success-bg);
    color: var(--success-text);
    padding: 16px;
    border-radius: 12px;
    text-align: center;
    animation: fadeIn 0.25s ease-in-out;
}

.error {
    background: var(--error-bg);
    color: var(--error-text);
    padding: 16px;
    border-radius: 12px;
    text-align: center;
    font-weight: 600;
    animation: fadeIn 0.25s ease-in-out;
}

.last-student {
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px dashed #e2e8f0;
    text-align: center;
    font-weight: 500;
    font-size: 14px;
    color: var(--text-muted);
}

.last-student span {
    color: var(--text-main);
    font-weight: 700;
    display: inline-block;
    margin-left: 4px;
}

.footer {
    margin-top: 24px;
    text-align: center;
    color: var(--text-muted);
    font-size: 11px;
    font-weight: 500;
}

/* Center and contain the footer */
.footer {
    margin-top: 20px;
    text-align: center;
    color: var(--text-muted);
    font-size: 12px;
    width: 100%;
}

/* Fix camera selector dropdown & buttons inside dark reader container */
#reader select, 
#reader button {
    background-color: #ffffff !important;
    color: #1e293b !important;
    border: 1px solid #cbd5e1 !important;
    padding: 8px 12px !important;
    border-radius: 8px !important;
    font-size: 13px !important;
    font-weight: 600 !important;
    cursor: pointer !important;
    margin: 6px auto !important;
}

#reader button:hover {
    background-color: #f1f5f9 !important;
}

/* Style the text links inside camera view (e.g., Scan an Image File) */
#reader a {
    color: #38bdf8 !important;
    text-decoration: none !important;
    font-size: 13px !important;
}

#reader span {
    color: #e2e8f0 !important;
}    

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
}

@media(max-width:480px){
    body {
        padding: 15px 10px;
    }
    .container {
        padding: 20px 16px;
    }
    h1 {
        font-size: 20px;
    }
}
</style>
</head>

<body>

    <div class="container">

    <!-- Replace logo.png with your school logo -->
    <img id="schoolLogo" src="logo.png" class="logo" alt="School Logo">

    <h1>ABC National High School</h1>
    <h3>Library Attendance Monitoring System</h3>

    <div style="text-align: center;">
    <div id="datetime"></div>
    </div>

    <div class="stats">
        <div class="stat-card">
            <span id="scanCount">0</span>
            <small>Today's Scans</small>
        </div>
    </div>

    <div id="reader"></div>

    <div id="result"></div>

    <div class="last-student">
        Last Scan:
        <span id="lastStudent">None</span>
    </div>

<div class="footer">
Version 1.0 | Powered by QR Technology
</div>
        
</div>
    

<script>
let WEBAPP_URL = "";

const schoolCode = new URLSearchParams(window.location.search).get("school");

async function loadSchoolConfig() {
    try {
        const response = await fetch("schools.json");
        const schools = await response.json();
        const school = schools[schoolCode];

        if (!school) {
            document.body.innerHTML = "<h1 style='text-align:center;margin-top:50px;'>Invalid or Missing School Code</h1>";
            return false;
        }

        WEBAPP_URL = school.webapp;
        document.querySelector("h1").innerText = school.name;
        document.getElementById("schoolLogo").src = school.logo;
        return true;
    } catch (err) {
        document.body.innerHTML = "<h1 style='text-align:center;margin-top:50px;'>Failed to load configuration</h1>";
        return false;
    }
}

function updateTime() {
    document.getElementById("datetime").innerHTML = new Date().toLocaleString();
}
setInterval(updateTime, 1000);
updateTime();

let lastScan = "";
let lastScanTime = 0;
let scanCount = 0;

async function onScanSuccess(decodedText) {
    const now = Date.now();

    // 10-second duplicate scan prevention
    if (decodedText === lastScan && now - lastScanTime < 10000) {
        return;
    }

    lastScan = decodedText;
    lastScanTime = now;

    try {
        // Using text/plain prevents the preflight OPTIONS request on Google Apps Script
        const response = await fetch(WEBAPP_URL, {
            method: 'POST',
            headers: {
                'Content-Type': 'text/plain;charset=utf-8'
            },
            body: JSON.stringify({ studentId: decodedText })
        });

        const data = await response.json();

        if (data.success) {
            scanCount++;
            document.getElementById("scanCount").innerText = scanCount;
            document.getElementById("lastStudent").innerText = data.name;
            document.getElementById("result").innerHTML = `
                <div class="success">
                    <div style="font-size:20px;">✅ Welcome</div>
                    <div style="font-size:28px;font-weight:bold;margin-top:5px;">${data.name}</div>
                </div>`;
        } else {
            document.getElementById("result").innerHTML = `
                <div class="error">❌ Student Not Found</div>`;
        }
    } catch (error) {
        document.getElementById("result").innerHTML = `
            <div class="error">⚠️ Network/Server Error</div>`;
    }
}

// Initialize scanner only after successful config load
loadSchoolConfig().then((isLoaded) => {
    if (!isLoaded) return;

    const scanner = new Html5QrcodeScanner("reader", {
        fps: 10,
        qrbox: 250
    });

    scanner.render(onScanSuccess);
});
</script>

</body>
</html>
