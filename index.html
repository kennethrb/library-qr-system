<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta charset="utf-8">
<title>Library QR Scanner</title>
<script src="https://unpkg.com/html5-qrcode"></script>

<style>
:root {
    --primary: #1e293b;
    --accent: #2563eb;
    --bg: #f1f5f9;
    --card-bg: #ffffff;
    --text-main: #0f172a;
    --text-muted: #64748b;
    --success-bg: #dcfce7;
    --success-text: #15803d;
    --error-bg: #fee2e2;
    --error-text: #b91c1c;
}

body {
    margin: 0;
    padding: 30px 15px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background-color: var(--bg);
    color: var(--text-main);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    box-sizing: border-box;
}

.container {
    width: 100%;
    max-width: 440px;
    background: var(--card-bg);
    padding: 28px 24px;
    border-radius: 20px;
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
    border: 1px solid rgba(226, 232, 240, 0.8);
    border-top: 5px solid var(--accent);
}

.logo {
    width: 80px;
    height: 80px;
    object-fit: contain;
    display: block;
    margin: 0 auto 16px;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.06));
}

h1 {
    text-align: center;
    color: var(--primary);
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin: 0 0 4px 0;
}

h3 {
    text-align: center;
    color: var(--text-muted);
    font-size: 13px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin: 0 0 16px 0;
} 

#datetime {
    text-align: center;
    font-size: 13px;
    font-weight: 500;
    margin-bottom: 20px;
    color: var(--text-muted);
    background: #f8fafc;
    padding: 6px 12px;
    border-radius: 20px;
    display: inline-block;
    width: fit-content;
    margin-left: auto;
    margin-right: auto;
}

.stats {
    display: flex;
    justify-content: center;
    margin-bottom: 20px;
}

.stat-card {
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 14px;
    padding: 10px 20px;
    min-width: 130px;
    text-align: center;
}

.stat-card span {
    display: block;
    font-size: 32px;
    font-weight: 800;
    color: var(--accent);
    line-height: 1.1;
}

.stat-card small {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    font-weight: 600;
    color: var(--text-muted);
}

#reader {
    width: 100% !important;
    border-radius: 14px;
    overflow: hidden;
    border: none !important;
    background: #0f172a !important;
    padding: 10px !important;
    display: flex !important;
    flex-direction: column !important;
    align-items: center !important;
    justify-content: center !important;
    text-align: center !important;
    box-sizing: border-box !important;
}

#reader video {
    object-fit: cover;
    border-radius: 14px;
}

#reader__dashboard {
    padding: 10px 0 !important;
}

#result {
    margin-top: 16px;
}

.success {
    background: var(--success-bg);
    color: var(--success-text);
    padding: 16px;
    border-radius: 12px;
    text-align: center;
    animation: fadeIn 0.25s ease-in-out;
}

.error {
    background: var(--error-bg);
    color: var(--error-text);
    padding: 16px;
    border-radius: 12px;
    text-align: center;
    font-weight: 600;
    animation: fadeIn 0.25s ease-in-out;
}

.last-student {
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px dashed #e2e8f0;
    text-align: center;
    font-weight: 500;
    font-size: 14px;
    color: var(--text-muted);
}

.last-student span {
    color: var(--text-main);
    font-weight: 700;
    display: inline-block;
    margin-left: 4px;
}

.footer {
    margin-top: 20px;
    text-align: center;
    color: var(--text-muted);
    font-size: 12px;
    width: 100%;
}

#reader select, 
#reader button {
    background-color: #ffffff !important;
    color: #1e293b !important;
    border: 1px solid #cbd5e1 !important;
    padding: 8px 12px !important;
    border-radius: 8px !important;
    font-size: 13px !important;
    font-weight: 600 !important;
    cursor: pointer !important;
    margin: 6px auto !important;
}

#reader button:hover {
    background-color: #f1f5f9 !important;
}

#reader__scan_region, 
#reader__dashboard_section_csr {
    background: transparent !important;
    color: #f8fafc !important;
}

#reader input[type="file"] {
    display: none !important;
}

#reader label {
    background-color: #ffffff !important;
    color: #0f172a !important;
    padding: 8px 16px !important;
    border-radius: 8px !important;
    font-size: 13px !important;
    font-weight: 600 !important;
    cursor: pointer !important;
    display: inline-block !important;
    margin-bottom: 10px !important;
}

#reader span, 
#reader div {
    color: #cbd5e1 !important;
    font-size: 13px !important;
}

#reader a {
    color: #38bdf8 !important;
    text-decoration: none !important;
    font-weight: 600 !important;
    font-size: 13px !important;
    display: inline-block !important;
    margin-top: 10px !important;
}

#reader a:hover {
    text-decoration: underline !important;
}

#reader > div,
#reader__scan_region,
#reader__dashboard,
#reader__dashboard_section,
#reader__dashboard_section_csr {
    width: 100% !important;
    margin: 0 auto !important;
    text-align: center !important;
    box-sizing: border-box !important;
}

#reader__dashboard_section_csr span {
    display: flex !important;
    flex-direction: column !important;
    align-items: center !important;
    gap: 8px !important;
    margin-right: 0 !important;
} 

#reader__dashboard_section_csr span,
#reader__dashboard_section_swaplink {
    color: #f8fafc !important;
}

#reader img[src*="data:image"] {
    filter: invert(1) brightness(1.8) !important;
}

#reader select {
    outline: none !important;
    color: #0f172a !important;
    font-weight: 600 !important;
} 

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
}

@media(max-width:480px){
    body {
        padding: 15px 10px;
    }
    .container {
        padding: 20px 16px;
    }
    h1 {
        font-size: 20px;
    }
}
</style>
</head>

<body>

    <div class="container">
        <img id="schoolLogo" src="logo.png" class="logo" alt="School Logo">

        <h1>ABC National High School</h1>
        <h3>Library Attendance Monitoring System</h3>

        <div style="text-align: center;">
            <div id="datetime"></div>
        </div>

        <div class="stats">
            <div class="stat-card">
                <span id="scanCount">...</span>
                <small>Today's Scans</small>
            </div>
        </div>

        <div id="reader"></div>

        <div id="result"></div>

        <div class="last-student">
            Last Scan:
            <span id="lastStudent">None</span>
        </div>

        <div class="footer">
            Version 1.0 | Powered by QR Technology
        </div>
    </div>

<script>
let WEBAPP_URL = "";

const schoolCode = new URLSearchParams(window.location.search).get("school");

// Web Audio API beep generator (no external audio file required)
function playBeep() {
    try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();

        oscillator.type = 'sine';
        oscillator.frequency.value = 880; // A5 tone
        gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);

        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        oscillator.start();
        oscillator.stop(audioCtx.currentTime + 0.15); // Plays for 150ms
    } catch (e) {
        console.log("Audio play prevented or unsupported.");
    }
}

async function loadSchoolConfig() {
    try {
        const response = await fetch("schools.json");
        const schools = await response.json();
        const school = schools[schoolCode];

        if (!school) {
            document.body.innerHTML = "<h1 style='text-align:center;margin-top:50px;'>Invalid or Missing School Code</h1>";
            return false;
        }

        WEBAPP_URL = school.webapp;
        document.querySelector("h1").innerText = school.name;
        document.getElementById("schoolLogo").src = school.logo;

        // Apply dynamic school colors if present in schools.json
        if (school.primary) {
            document.documentElement.style.setProperty('--primary', school.primary);
        }
        if (school.accent) {
            document.documentElement.style.setProperty('--accent', school.accent);
        }

        return true;
    } catch (err) {
        document.body.innerHTML = "<h1 style='text-align:center;margin-top:50px;'>Failed to load configuration</h1>";
        return false;
    }
}

async function fetchInitialData() {
    if (!WEBAPP_URL) return;
    try {
        const response = await fetch(WEBAPP_URL);
        const data = await response.json();
        
        if (data.todayCount !== undefined) {
            document.getElementById("scanCount").innerText = data.todayCount;
        }
        if (data.lastStudent) {
            document.getElementById("lastStudent").innerText = data.lastStudent;
        }
    } catch (err) {
        console.error("Failed to fetch initial state:", err);
        document.getElementById("scanCount").innerText = "0";
    }
}

function updateTime() {
    document.getElementById("datetime").innerHTML = new Date().toLocaleString();
}
setInterval(updateTime, 1000);
updateTime();

let lastScan = "";
let lastScanTime = 0;

async function onScanSuccess(decodedText) {
    const now = Date.now();

    // 10-second duplicate scan prevention
    if (decodedText === lastScan && now - lastScanTime < 10000) {
        return;
    }

    lastScan = decodedText;
    lastScanTime = now;

    try {
        const response = await fetch(WEBAPP_URL, {
            method: 'POST',
            headers: {
                'Content-Type': 'text/plain;charset=utf-8'
            },
            body: JSON.stringify({ studentId: decodedText })
        });

        const data = await response.json();

        if (data.success) {
            playBeep(); // Audio feedback plays only on successful match
            
            if (data.todayCount !== undefined) {
                document.getElementById("scanCount").innerText = data.todayCount;
            }
            document.getElementById("lastStudent").innerText = data.name;
            document.getElementById("result").innerHTML = `
                <div class="success">
                    <div style="font-size:20px;">✅ Welcome</div>
                    <div style="font-size:28px;font-weight:bold;margin-top:5px;">${data.name}</div>
                </div>`;
        } else {
            document.getElementById("result").innerHTML = `
                <div class="error">❌ Student Not Found</div>`;
        }
    } catch (error) {
        document.getElementById("result").innerHTML = `
            <div class="error">⚠️ Network/Server Error</div>`;
    }
}

// Initialize scanner and state only after config loads
loadSchoolConfig().then(async (isLoaded) => {
    if (!isLoaded) return;

    await fetchInitialData();

    const scanner = new Html5QrcodeScanner("reader", {
        fps: 10,
        qrbox: 250,
        aspectRatio: 1.0
    });

    scanner.render(onScanSuccess);
});
</script>

</body>
</html>
