<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
    
<meta charset="utf-8">
<title>Library QR Scanner</title>
<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{
    margin:0;
    padding:20px;
    font-family:'Segoe UI',sans-serif;
    background:#f5f7fb;
}

.container{
    max-width:500px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:15px;
    box-shadow:0 3px 10px rgba(0,0,0,.1);
}

.logo{
    width:100px;
    display:block;
    margin:auto;
    margin-bottom:15px;
}

h1{
    text-align:center;
    color:#003366;
    font-size:28px;
}

#datetime{
    text-align:center;
    margin-bottom:20px;
    color:#666;
}

#reader{
    width:100% !important;
    border-radius:12px;
    overflow:hidden;
}

.stats{
    display:flex;
    justify-content:center;
    margin-bottom:20px;
}

.stat-card{
    background:#f8f9fa;
    border-radius:12px;
    padding:12px;
    width:150px;
    text-align:center;
}

.stat-card span{
    display:block;
    font-size:30px;
    font-weight:bold;
    text-align: center;
}

.success{
    background:#d4edda;
    color:#155724;
    padding:15px;
    border-radius:10px;
    text-align:center;
}

.error{
    background:#f8d7da;
    color:#721c24;
    padding:15px;
    border-radius:10px;
}

.last-student{
    margin-top:15px;
    text-align:center;
    font-weight:bold;
    font-size:18px;
}

.footer{
    margin-top:20px;
    text-align:center;
    color:#888;
    font-size:12px;
}    

@media(max-width:480px){
    h1{
        font-size:22px;
    }
}
</style>
</head>

<body>

    <div class="container">

    <!-- Replace logo.png with your school logo -->
    <img src="logo.png" class="logo" alt="School Logo">

    <h1>📚 ABC National High School</h1>
    <h3>Library Attendance Monitoring System</h3>

    <div id="datetime"></div>

    <div class="stats">
        <div class="stat-card">
            <span id="scanCount">0</span>
            <small>Today's Scans</small>
        </div>
    </div>

    <div id="reader"></div>

    <div id="result"></div>

    <div class="last-student">
        Last Scan:
        <span id="lastStudent">None</span>
    </div>

</div>
    
<div class="footer">
Version 1.0 | Powered by QR Technology
</div>

<script>

const WEBAPP_URL = "https://script.google.com/macros/s/AKfycbwZt98HfRSdzgFoWVrGG3hjFuG8W7OqdVQw1R8laWfMoA29ArTQv7H88rNl6gtIbR4mmg/exec";

    function updateTime(){

    document.getElementById("datetime").innerHTML =
    new Date().toLocaleString();

}

setInterval(updateTime,1000);
updateTime();
    
let lastScan = "";
let lastScanTime = 0;
let scanCount = 0;

function onScanSuccess(decodedText) {

    const now = Date.now();

    if(decodedText === lastScan &&
       now - lastScanTime < 10000){
        return;
    }

    lastScan = decodedText;
    lastScanTime = now;

    fetch(WEBAPP_URL,{
        method:'POST',
        body: JSON.stringify({
            studentId: decodedText
        })
    })
    .then(response => response.json())
    .then(data => {

        if(data.success){

            scanCount++;

            document.getElementById("scanCount").innerText =
            scanCount;

            document.getElementById("lastStudent").innerText =
            data.name;

            document.getElementById("result").innerHTML =
            `
            <div class="success">
                <div style="font-size:20px;">✅ Welcome</div>
                <div style="font-size:28px;font-weight:bold;margin-top:5px;">
                    ${data.name}
                </div>
            </div>
            `;

        } else {

            document.getElementById("result").innerHTML =
            `
            <div class="error">
                ❌ Student Not Found
            </div>
            `;

        }

    });

}

const scanner = new Html5QrcodeScanner(
    "reader",
    {
        fps: 10,
        qrbox: 250
    }
);

scanner.render(onScanSuccess);

</script>

</body>
</html>
