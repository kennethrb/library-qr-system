<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
    
<meta charset="utf-8">
<title>Library QR Scanner</title>
<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body {
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 15px;
    margin: 0;
    background: #f5f5f5;
}

.container {
    background: white;
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.1);
    margin-top: 20px;
}

h2 {
    font-size: 1.5rem;
    margin-bottom: 20px;
}

#reader {
    width: 100% !important;
    max-width: 400px;
    margin: auto;
    border-radius: 10px;
    overflow: hidden;
}

#result {
    margin-top: 15px;
    font-size: 1.2rem;
    font-weight: bold;
}

@media (max-width: 480px) {
    h2 {
        font-size: 1.2rem;
    }

    #result {
        font-size: 1rem;
    }
}
</style>
</head>

<body>

<div class="container">
    <h2>📚 Library Attendance System</h2>
    <p>Scan Student QR Code</p>

    <div id="reader"></div>

    <div id="result"></div>
</div>

<script>

const WEBAPP_URL = "https://script.google.com/macros/s/AKfycbwZt98HfRSdzgFoWVrGG3hjFuG8W7OqdVQw1R8laWfMoA29ArTQv7H88rNl6gtIbR4mmg/exec";

let lastScan = "";

function onScanSuccess(decodedText) {

    if(decodedText === lastScan){
        return;
    }

    lastScan = decodedText;

    fetch(WEBAPP_URL,{
        method:'POST',
        body: JSON.stringify({
            studentId: decodedText
        })
    })
    .then(response => response.json())
    .then(data => {

        if(data.success){
            document.getElementById("result").innerHTML =
`<div style="background:#d4edda;color:#155724;padding:15px;border-radius:8px;">
✅ Welcome ${data.name}
</div>`;
        } else {
            document.getElementById("result").innerHTML =
            "❌ Student Not Found";
        }

        setTimeout(() => {
            lastScan = "";
        }, 3000);
    });

}

const scanner = new Html5QrcodeScanner(
    "reader",
    {
        fps: 10,
        qrbox: 250
    }
);

scanner.render(onScanSuccess);

</script>

</body>
</html>
